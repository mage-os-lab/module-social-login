name: Check Extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.supported.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: graycoreio/github-actions-magento2/supported-version@v8.9.0
        id: supported
        with:
          project: mage-os

  # Coding standard, setup:di:compile and the unit suite (Test/Unit) inside a Mage-OS
  # install, for every supported version.
  check-extension:
    needs: compute-matrix
    uses: graycoreio/github-actions-magento2/.github/workflows/check-extension.yaml@v8.9.0
    with:
      matrix: ${{ needs.compute-matrix.outputs.matrix }}
      # The default mirror only proxies magento/* packages; the
      # mage-os/project-community-edition metapackage lives on repo.mage-os.org.
      magento_repository: https://repo.mage-os.org/
